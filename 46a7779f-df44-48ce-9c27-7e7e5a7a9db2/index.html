<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invite Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F6F1F0; --surface: #FFFFFF; --ink: #2A1F1F; --muted: #6E6060; --line: #E5DADA;
    --accent: #8E1B26; --accent-ink: #FFFFFF; --soft: #F3E6E6; --focus: #C2410C;
    --f-ui: 'Mukta', 'Segoe UI', system-ui, sans-serif;
    --f-head: 'Marcellus', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161112; --surface: #211A1B; --ink: #F1E8E7; --muted: #B4A6A6; --line: #3A2F30;
      --accent: #E58C95; --accent-ink: #2A0A0E; --soft: #2C2122; --focus: #FDBA74;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161112; --surface: #211A1B; --ink: #F1E8E7; --muted: #B4A6A6; --line: #3A2F30;
    --accent: #E58C95; --accent-ink: #2A0A0E; --soft: #2C2122; --focus: #FDBA74;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
  [hidden] { display: none !important; }

  /* One screen on a laptop: a slim header, then pick · preview · send side by side. Each column scrolls on its own if it must. */
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 12px 16px; max-width: 1440px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
  h1 { font-family: var(--f-head); font-weight: 400; font-size: 1.35rem; margin: 0; line-height: 1.2; }
  .eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

  .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .stage { grid-column: 2; grid-row: 1 / span 2; }
  }
  @media (min-width: 1100px) {
    .app { height: 100vh; height: 100dvh; }
    .layout { grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(320px, 400px); grid-template-rows: minmax(0, 1fr); min-height: 0; }
    .stage { grid-column: 2; grid-row: 1; min-height: 0; }
    .layout > * { min-height: 0; overflow: auto; }
    .send { grid-column: 3; grid-row: 1; }
    .pick { align-self: start; max-height: 100%; }
    /* Only the group list scrolls if there are more groups than fit. */
    .pick fieldset { flex: 1 1 auto; min-height: 120px; overflow: auto; padding: 2px; margin: -2px; }
  }

  .panel { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 3px; min-width: 0; }
  legend, .field-label { font-family: var(--f-head); font-size: .98rem; padding: 0; margin-bottom: 4px; display: block; }
  .hint { font-size: .8rem; color: var(--muted); margin: 0; }

  .opt { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--soft); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); font-weight: 600; font-size: .78rem; }
  .opt:has(input:checked) .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt-body { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .opt-t { font-weight: 600; }
  .opt-s { font-size: .76rem; color: var(--muted); margin-left: 6px; }

  select, input[type="text"], input[type="url"], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  textarea { resize: vertical; font-size: .84rem; line-height: 1.45; min-height: 180px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  .btn { font: inherit; font-weight: 600; font-size: .86rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .status { font-size: .8rem; color: var(--muted); min-height: 1.2em; margin: 0; }

  .send .msg { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  .send textarea { flex: 1; }
  .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head-row .field-label { margin: 0; }
  details { font-size: .8rem; color: var(--muted); }
  details summary { cursor: pointer; }
  details[open] summary { margin-bottom: 6px; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .stage-head { text-align: center; line-height: 1.3; }
  .stage-head h2 { font-family: var(--f-head); font-weight: 400; font-size: 1.1rem; margin: 0; }
  .stage-head span { color: var(--muted); font-size: .82rem; }
  .fit { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
  /* The card renders at a real phone size (390 × 780) and is scaled down to fit the space. */
  .phone { border: 8px solid #1d1718; border-radius: 30px; overflow: hidden; background: #000; box-shadow: 0 16px 40px -18px rgba(0,0,0,.45); flex: none; }
  .phone iframe { display: block; width: 390px; height: 780px; border: 0; background: #fff; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Nilaksh &amp; Ayushi</h1>
    <span class="eyebrow">Invite studio · 28 Nov – 4 Dec 2026</span>
  </header>

  <form class="layout" id="controls" autocomplete="off">
    <div class="panel pick">
      <div>
        <label class="field-label" for="to">Guest name <span class="hint">(optional)</span></label>
        <input type="text" id="to" placeholder="e.g. Sharma Ji &amp; Family" maxlength="60">
      </div>
      <div class="pair">
        <div>
          <label class="field-label" for="variant">E-card</label>
          <select id="variant"></select>
        </div>
        <div>
          <label class="field-label" for="lang">Language</label>
          <select id="lang">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
          </select>
        </div>
      </div>
      <p class="hint" id="langHint" hidden></p>
      <fieldset id="groups"><legend>Guest group</legend></fieldset>
    </div>

    <section class="stage" aria-labelledby="pvTitle">
      <div class="stage-head"><h2 id="pvTitle">Preview</h2><span id="pvSub"></span></div>
      <div class="fit" id="fit"><div class="phone" id="phone"><iframe id="preview" title="E-card preview"></iframe></div></div>
    </section>

    <div class="panel send">
      <div>
        <label class="field-label" for="link">Guest link</label>
        <div class="row">
          <input type="text" id="link" readonly>
          <button type="button" class="btn ghost" id="copyLink">Copy</button>
        </div>
      </div>
      <div class="msg">
        <div class="head-row">
          <label class="field-label" for="msg">WhatsApp message</label>
          <button type="button" class="btn" id="copyMsg">Copy message</button>
        </div>
        <textarea id="msg"></textarea>
      </div>
      <div class="row">
        <a class="btn ghost" id="wa" target="_blank" rel="noopener">Open in WhatsApp</a>
        <a class="btn ghost" id="open" target="_blank" rel="noopener">Open e-card</a>
        <a class="btn ghost" id="png" target="_blank" rel="noopener">Image card</a>
      </div>
      <p class="status" id="status" role="status"></p>
      <details>
        <summary>Hosted address</summary>
        <label class="hint" for="base">Address of the hosted invite.html</label>
        <input type="url" id="base" spellcheck="false">
      </details>
    </div>
  </form>
</div>

<div id="gate" style="position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:var(--bg)">
  <form id="gateForm" class="panel" style="width:min(360px,100%)">
    <span class="eyebrow">Invite studio</span>
    <label class="field-label" for="gatePw">Password</label>
    <input type="password" id="gatePw" autocomplete="current-password" required>
    <label class="hint"><input type="checkbox" id="gateKeep"> Remember on this device</label>
    <button class="btn" type="submit">Open studio</button>
    <p class="status" id="gateMsg" role="status"></p>
  </form>
</div>

<script type="text/plain" id="studio-main">
(function () {
  'use strict';
  const I = window.Invite, D = I.data;
  const $ = id => document.getElementById(id);
  const esc = I.esc;
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  };
  const localInvite = new URL('invite.html', location.href).href.split('?')[0];
  const HOSTED = 'https://nilaksh-ayushi.github.io/invite.html';
  // Online copy (private claude.ai artifact) ships without invite.html and the variants: preview the live site instead.
  const ONLINE = location.protocol !== 'file:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const savedBase = store.get('studio2.base');
  const S = {
    code: store.get('studio2.code') || D.GROUPS.find(g => g.n === D.DEFAULT_GROUP).code,
    variant: '',
    lang: store.get('studio2.lang') === 'hi' ? 'hi' : 'en',
    to: '',
    // The site moved off Netlify; drop a remembered netlify.app address.
    base: savedBase && !/netlify\.app/i.test(savedBase) ? savedBase : HOSTED,
  };
  if (!D.GROUPS.some(g => g.code === S.code)) S.code = D.GROUPS[0].code;
  const group = () => D.GROUPS.find(g => g.code === S.code);
  const vname = id => (D.VARIANTS.find(v => v.id === id) || {}).name || id;
  // Hindi: every variant with hi: true in data.js has a Hindi version; patrika is Hindi only.
  const vid = () => S.variant || group().variant;
  const hindiOK = id => !!(D.VARIANTS.find(v => v.id === id) || {}).hi;
  const isHindi = () => vid() === 'patrika' || (S.lang === 'hi' && hindiOK(vid()));
  const shortName = e => e.name.split(/,| with /)[0].replace(' Ceremony', '');

  $('groups').insertAdjacentHTML('beforeend', D.GROUPS.map(g => {
    const evs = g.events.map(n => shortName(D.EVENTS.find(e => e.n === n))).join(' · ');
    return `<label class="opt" title="${esc(evs)}"><input type="radio" name="group" value="${g.code}"><span class="num">${g.n}</span>
      <span class="opt-body"><span class="opt-t">${esc(g.label)}</span><span class="opt-s">${esc(evs)}</span></span></label>`;
  }).join(''));

  function query(base, extra) {
    const g = group(), q = new URLSearchParams({ i: g.code });
    if (S.variant && S.variant !== g.variant) q.set('t', S.variant);
    if (S.to.trim()) q.set('to', S.to.trim());
    if (isHindi() && vid() !== 'patrika') q.set('lang', 'hi');
    Object.entries(extra || {}).forEach(([k, v]) => q.set(k, v));
    return base + '?' + q.toString().replace(/\+/g, '%20');
  }
  function guestLink() {
    if (!/^https?:\/\//.test(S.base)) return '';
    // Each variant has its own page (built by scripts/build_site.py) carrying its own WhatsApp preview image.
    const g = group(), q = new URLSearchParams({ i: g.code });
    if (S.to.trim()) q.set('to', S.to.trim());
    // The Hindi version of a variant is its "-hi" page (own Hindi WhatsApp preview).
    const page = vid() + (isHindi() && vid() !== 'patrika' ? '-hi' : '');
    return S.base.split('?')[0].replace(/[^/]*$/, '') + page + '?' + q.toString().replace(/\+/g, '%20');
  }

  // Hindi e-cards get a Hindi message too.
  function messageHi(link) {
    const g = group(), ctx = I.buildCtx({ code: g.code, guest: S.to.trim() });
    const H = D.PEOPLE.hi, occ = ctx.occasion;
    const lines = ctx.events.map(e => `• ${I.hindi.date(e.date, true)}, ${I.hindi.time(e)} · ${e.hi || e.name}`);
    const what = {
      wedding: 'के शुभ विवाह समारोह में', engagement: 'के सगाई एवं संगीत समारोह में', haldi: 'के हल्दी एवं भात समारोह में',
      mehandi: 'के मेहंदी एवं गीत समारोह में', sunderkand: 'के शुभ विवाह से पूर्व श्री सुंदरकांड पाठ में',
    }[occ.key];
    return [
      occ.key === 'sunderkand' ? '🙏 जय श्री राम!' : '🙏 जय श्री गणेश!',
      '',
      ctx.guest ? `आदरणीय ${ctx.guest},` : 'आदरणीय परिवारजन एवं मित्रगण,',
      '',
      `${H.family} आपको ${H.groom} संग ${H.bride} ${what} सादर आमंत्रित करता है।`,
      '',
      ...lines,
      '',
      link ? `अपना निमंत्रण पत्र खोलने के लिए नीचे दिए लिंक को छुएँ 👇\n${link}` : '(Add the hosted invite address in the studio to get the link.)',
      '',
      `सप्रेम,\n${H.hosts}`,
    ].join('\n');
  }

  function message(link) {
    if (isHindi()) return messageHi(link);
    const g = group(), ctx = I.buildCtx({ code: g.code, guest: S.to.trim() });
    const P = D.PEOPLE, occ = ctx.occasion;
    const lines = ctx.events.map(e => `• ${e.dateShort}, ${e.time} · ${shortName(e)}`);
    const what = {
      wedding: 'the wedding celebrations', engagement: 'the Sagai & Sangeet', haldi: 'the Haldi & Bhaat',
      mehandi: 'the Mehandi', sunderkand: 'the Shri Sunderkand Path',
    }[occ.key];
    return [
      occ.key === 'sunderkand' ? '🙏 Jai Shri Ram!' : '🙏 Jai Shri Ganesh!',
      '',
      `${ctx.greeting},`,
      '',
      `With joy, the ${P.family} invites you to ${what} of ${P.groom} & ${P.bride}.`,
      '',
      ...lines,
      '',
      link ? `Tap to open your invite 👇\n${link}` : '(Add the hosted invite address in the studio to get the link.)',
      '',
      `With love,\n${P.hosts}`,
    ].join('\n');
  }

  // Scale the 390 × 780 card so the whole phone fits: by width on small screens, by width and height on a laptop.
  const PW = 390, PH = 780, BORDER = 16, wide = matchMedia('(min-width: 1100px)');
  function fit() {
    const box = $('fit'), w = box.clientWidth - BORDER, h = wide.matches ? box.clientHeight - BORDER : Infinity;
    const s = Math.max(.4, Math.min(1, w / PW, h / PH));
    $('preview').style.transform = `scale(${s})`;
    $('phone').style.width = Math.floor(PW * s + BORDER) + 'px';
    $('phone').style.height = Math.floor(PH * s + BORDER) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('fit'));
  else addEventListener('resize', fit);

  let reloadTimer = 0;
  function update(reloadNow) {
    const g = group();
    document.querySelector(`input[name="group"][value="${g.code}"]`).checked = true;
    [...$('variant').options].forEach(o => { o.textContent = vname(o.value) + (o.value === g.variant ? ' (group’s own)' : ''); });
    $('variant').value = S.variant || g.variant;
    $('lang').value = S.lang;
    const hint = vid() === 'patrika' ? 'The Simple Hindi Card is always in Hindi.'
      : S.lang === 'hi' && !hindiOK(vid()) ? 'This e-card has no Hindi version yet, so the guest gets it in English.' : '';
    $('langHint').textContent = hint;
    $('langHint').hidden = !hint;
    $('pvTitle').textContent = `Group ${g.n} · ${vname(vid())}${isHindi() && vid() !== 'patrika' ? ' · हिंदी' : ''}`;
    $('pvSub').textContent = S.to.trim() ? 'For ' + S.to.trim() : 'No guest name';

    const link = guestLink();
    $('link').value = link || 'Set the hosted address below, e.g. ' + HOSTED;
    const msg = message(link);
    $('msg').value = msg;
    // api.whatsapp.com, not wa.me: the wa.me redirect turns emoji into U+FFFD boxes in WhatsApp Desktop.
    $('wa').href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msg);
    const cardUrl = ONLINE ? (link || 'about:blank') : query(localInvite);
    $('open').href = cardUrl;
    $('png').href = `cards/${vid() === 'patrika' ? 'patrika/' : isHindi() ? 'hindi/' : ''}group-${g.n}-${g.slug}.png`;
    $('png').hidden = ONLINE;

    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => { $('preview').src = cardUrl; }, reloadNow ? 0 : 500);
    store.set('studio2.code', g.code);
  }

  function copy(text, what) {
    const done = () => { $('status').textContent = what + ' copied.'; };
    const fail = () => { $('status').textContent = 'Copy was blocked here. The text is selected, so press Ctrl+C (or long-press and Copy).'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }

  $('variant').innerHTML = D.VARIANTS.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('');
  $('controls').addEventListener('submit', e => e.preventDefault());
  $('controls').addEventListener('change', e => {
    if (e.target.name === 'group') { S.code = e.target.value; S.variant = ''; update(true); }
    if (e.target.id === 'variant') { S.variant = e.target.value === group().variant ? '' : e.target.value; update(true); }
    if (e.target.id === 'lang') { S.lang = e.target.value; store.set('studio2.lang', S.lang); update(true); }
  });
  $('to').addEventListener('input', e => { S.to = e.target.value; update(false); });
  $('base').value = S.base;
  $('base').addEventListener('input', e => { S.base = e.target.value.trim(); store.set('studio2.base', S.base); update(false); });
  $('copyLink').addEventListener('click', () => { $('link').select(); copy($('link').value, 'Link'); });
  $('copyMsg').addEventListener('click', () => { $('msg').select(); copy($('msg').value, 'Message'); });

  fit();
  update(true);
})();
</script>
</body>
</html>
